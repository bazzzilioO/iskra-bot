<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SREDA</title>
  <meta name="description" content="Инфраструктура для инструментов независимых артистов. ИСКРА — первый запущенный продукт." />
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#0b0d10; color:#e8eef6;
      display:flex; min-height:100vh; align-items:center; justify-content:center;
    }
    .card{
      width:min(720px, 92vw);
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:28px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }
    h1{ margin:0 0 10px; letter-spacing:.06em; font-size:36px; }
    p{ margin:0 0 18px; line-height:1.45; color:#b9c6d6; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      padding:14px 18px; border-radius:14px;
      background:#e8eef6; color:#0b0d10; text-decoration:none; font-weight:700;
      border:0;
    }
    .btn:hover{ opacity:.92; }
    .btn-secondary{
      background:transparent; color:#e8eef6; border:1px solid rgba(255,255,255,.2);
    }
    .btn-secondary:hover{ background:rgba(255,255,255,.05); }
    .row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
    .link{ color:#b9c6d6; text-decoration:none; }
    .link:hover{ color:#e8eef6; }
    .tag{
      display:inline-block; padding:6px 10px; border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      color:#b9c6d6; font-size:12px; margin-bottom:14px;
    }
    .status{
      margin-top:18px; font-size:13px; color:#8ea0b5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SREDA</h1>
    <p>Инфраструктура для инструментов независимых артистов.<br>ИСКРА — первый запущенный продукт.</p>

    <div class="row">
      <a class="btn" href="https://go.sreda.pw/" target="_blank" rel="noopener">
        Перейти к ИСКРЕ
      </a>
      <a class="btn btn-secondary" href="https://t.me/iskramusic_bot" target="_blank" rel="noopener">
        Открыть ИСКРУ в Telegram
      </a>
    </div>
    
    <a class="link" href="/updates" style="display:block; margin-top:14px;">
      Обновления проекта
    </a>

    <p class="status">
      SREDA находится в разработке. Новые инструменты запускаются постепенно.
    </p>

    <p style="margin-top:18px; font-size:13px; color:#8ea0b5;">
      © SREDA • beta
    </p>
  </div>
</body>
</html>
